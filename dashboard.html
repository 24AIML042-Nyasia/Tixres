<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Metrics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>IT Metrics Dashboard</h1>
        <p>Monitor your infrastructure metrics in real-time</p>
    </div>

    <div class="container">
        <!-- Server Configuration -->
        <div class="config-section">
            <h2>Server Configuration</h2>
            <div class="config-input">
                <input type="text" id="serverUrl" placeholder="http://localhost:8000" value="http://localhost:8000">
                <button onclick="updateServerUrl()">Connect</button>
            </div>
            <div id="configError" class="error" style="display: none; margin-top: 1rem;"></div>
        </div>

        <!-- Statistics Overview -->
        <div id="statsSection" class="stats-grid" style="display: none;">
            <div class="stat-card">
                <h3>Total Agents</h3>
                <div class="value" id="totalAgents">-</div>
                <div class="subtext"><span id="activeAgents">0</span> active</div>
            </div>
            <div class="stat-card">
                <h3>Total Metrics</h3>
                <div class="value" id="totalMetrics">-</div>
                <div class="subtext"><span id="metricsLastHour">0</span> in last hour</div>
            </div>
            <div class="stat-card">
                <h3>Numeric Metrics</h3>
                <div class="value" id="numericMetrics">-</div>
            </div>
            <div class="stat-card">
                <h3>JSON Metrics</h3>
                <div class="value" id="jsonMetrics">-</div>
            </div>
        </div>

        <!-- Tabs -->
        <div id="tabsSection" style="display: none;">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('agents')">Agents</button>
                <button class="tab" onclick="switchTab('numeric')">Numeric Metrics</button>
                <button class="tab" onclick="switchTab('json')">JSON Metrics</button>
            </div>

            <!-- Agents Tab -->
            <div id="agents-tab" class="tab-content active">
                <button class="refresh-btn" onclick="loadAgents()">Refresh</button>
                <div id="agentsContent" class="agents-grid">
                    <div class="loading">Loading agents...</div>
                </div>
            </div>

            <!-- Numeric Metrics Tab -->
            <div id="numeric-tab" class="tab-content">
                <div class="filters">
                    <select id="numericAgentFilter" onchange="loadNumericMetrics()">
                        <option value="">All Agents</option>
                    </select>
                    <input type="text" id="numericMetricFilter" placeholder="Metric name" onchange="loadNumericMetrics()">
                    <input type="number" id="numericLimit" placeholder="Limit" value="100" onchange="loadNumericMetrics()">
                    <button class="refresh-btn" onclick="loadNumericMetrics()" style="margin: 0;">Refresh</button>
                </div>
                <div id="numericContent" class="metrics-table">
                    <div class="loading">Loading numeric metrics...</div>
                </div>
            </div>

            <!-- JSON Metrics Tab -->
            <div id="json-tab" class="tab-content">
                <div class="filters">
                    <select id="jsonAgentFilter" onchange="loadJsonMetrics()">
                        <option value="">All Agents</option>
                    </select>
                    <input type="text" id="jsonMetricFilter" placeholder="Metric name" onchange="loadJsonMetrics()">
                    <input type="number" id="jsonLimit" placeholder="Limit" value="100" onchange="loadJsonMetrics()">
                    <button class="refresh-btn" onclick="loadJsonMetrics()" style="margin: 0;">Refresh</button>
                </div>
                <div id="jsonContent" class="metrics-table">
                    <div class="loading">Loading JSON metrics...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
