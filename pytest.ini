[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=server_db
    --cov=server_routes
    --cov=server_utils
    --cov=metric_rollup
    --cov=server_auth
    --cov=anomaly
    --cov=guidance
    --cov=alert_service
    --cov=ticket_service
    --cov=influx_db
    --cov-report=term-missing
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    postgres: requires Postgres (deselect with '-m "not postgres"')
    influx: requires InfluxDB (deselect with '-m "not influx"')
