[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m \"not slow\"')
    postgres: requires Postgres (deselect with '-m \"not postgres\"')
    influx: requires InfluxDB (deselect with '-m \"not influx\"')
