<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tixres – Incident Guidance</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .guidance-container { max-width: 820px; margin: 0 auto; }
      .guidance-header { border-bottom: 1px solid #30363d; padding-bottom: 20px; margin-bottom: 30px; }
      .guidance-title { font-size: 28px; font-weight: 700; color: #e6edf3; margin-bottom: 10px; }
      .guidance-desc { font-size: 15px; color: #8b949e; line-height: 1.6; }
      .incident-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 20px; margin-bottom: 30px; }
      .incident-box-title { font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
      .step-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-start; }
      .step-num { background: #1f6feb; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
      .step-text { font-size: 15px; color: #c9d1d9; line-height: 1.55; padding-top: 3px; }
      .priority-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-left: 10px; letter-spacing: .4px; }
      .prio-CRITICAL { background: rgba(248,81,73,.15); color: #f85149; border: 1px solid rgba(248,81,73,.3); }
      .prio-HIGH     { background: rgba(210,153,34,.15); color: #d29922; border: 1px solid rgba(210,153,34,.3); }
      .prio-MEDIUM   { background: rgba(31,111,235,.15); color: #58a6ff; border: 1px solid rgba(31,111,235,.3); }
      .prio-LOW      { background: rgba(63,185,80,.15);  color: #3fb950; border: 1px solid rgba(63,185,80,.3); }
      .back-link { display: inline-flex; align-items: center; gap: 6px; color: #58a6ff; text-decoration: none; font-size: 14px; margin-bottom: 24px; }
      .back-link:hover { text-decoration: underline; }
      .nav-links { display: flex; gap: 20px; }
      .nav-links a { color: #8b949e; text-decoration: none; font-size: 13px; transition: color .15s; }
      .nav-links a:hover { color: #e6edf3; }
      .nav-links a.active { color: #fff; font-weight: 600; }
      .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
      .meta-item strong { color: #8b949e; }
      .host-chip { font-family: monospace; font-size: 11px; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; color: #58a6ff; }
    </style>
  </head>
  <body>
    <div class="dash">
      <div class="topbar">
        <div class="topbar-left" style="flex:1;">
          <div style="display:flex; align-items:center; gap:7px;">
            <div class="status-dot"></div>
            <span class="logo">Tixres</span>
          </div>
          <nav class="nav-links" style="margin-left:16px;">
            <a href="index.html">Dashboard</a>
            <a href="alerts.html">Alerts</a>
            <a href="incidents.html">Incidents</a>
            <a href="guidance.html">Guidance</a>
            <a href="rollups.html">Metrics</a>
          </nav>
        </div>
        <div id="user-pill-container"></div>
      </div>

      <div class="guidance-container">
        <a href="incidents.html" class="back-link">← Back to Incidents</a>

        <div id="guidance-content">
          <div class="alert-empty">Loading guidance…</div>
        </div>
      </div>
    </div>

    <script type="module">
      import { createWsClient } from "./js/ws.js";
      import { qsParam } from "./js/utils.js";
      import { requireAuth, getToken, renderUserPill, logout } from "./js/auth.js";
      import { WS_URL } from "./js/config.js";

      requireAuth("incident_guidance.html");
      renderUserPill("user-pill-container");
      window.handleLogout = logout;

      const token      = getToken();
      const incidentId = parseInt(qsParam("incident_id"));
      const incidentKey = qsParam("incident_key");

      if (!incidentId && !incidentKey) {
        document.getElementById("guidance-content").innerHTML =
          '<div class="alert-empty">No incident specified.</div>';
      } else {
        const ws = createWsClient(WS_URL, {
          onOpen: () => {
            ws.send({ event: "ui_subscribe", data: { token } });
            ws.send({
              event: "ui_get_guidance",
              data: { incident_id: incidentId || undefined, incident_key: incidentKey || undefined }
            });
          },
          onMessage: (msg) => {
            if (msg.event === "ui_get_guidance" && msg.ok) renderGuidance(msg.data);
            if (msg.event === "ui_get_guidance" && !msg.ok) {
              document.getElementById("guidance-content").innerHTML =
                `<div class="alert-empty">⚠️ ${msg.error || "Guidance not available."}</div>`;
            }
          }
        });
        ws.connect();
      }


      function escHtml(str) {
        return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function renderGuidance(data) {
        const { incident, guidance } = data;
        const content = document.getElementById("guidance-content");

        content.innerHTML = `
          <div class="guidance-header">
            <div style="display:flex; align-items:center; flex-wrap:wrap; gap:10px;">
              <h1 class="guidance-title">${escHtml(guidance.title)}</h1>
              <span class="priority-badge prio-${guidance.priority}">${guidance.priority}</span>
            </div>
            <p class="guidance-desc">${escHtml(guidance.description)}</p>
          </div>

          <div class="incident-box">
            <div class="incident-box-title">Incident Context</div>
            <div class="meta-grid">
              <div class="meta-item"><strong>Host:</strong> <span class="host-chip">${escHtml(incident.host_id)}</span></div>
              <div class="meta-item"><strong>Service:</strong> ${escHtml(incident.service)}</div>
              <div class="meta-item"><strong>Anomaly:</strong> ${escHtml(incident.anomaly_type)}</div>
              <div class="meta-item"><strong>First Seen:</strong> ${escHtml(incident.first_seen)}</div>
              <div class="meta-item"><strong>Severity:</strong> ${escHtml(incident.severity)}</div>
              <div class="meta-item"><strong>Status:</strong> ${escHtml(incident.status)}</div>
            </div>
          </div>

          <h2 style="font-size:18px; font-weight:600; margin-bottom:20px;">Resolution Steps</h2>
          <div>
            ${guidance.steps.map((step, idx) => `
              <div class="step-item">
                <div class="step-num">${idx + 1}</div>
                <div class="step-text">${escHtml(step)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    </script>
  </body>
</html>
